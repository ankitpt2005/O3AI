<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">O3AI — the engine that proves work before money moves</title>
<desc id="desc">O3AI's four evidence-gated Working Tower floors power a PayPal sandbox transaction only after human approval.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071528"/><stop offset="1" stop-color="#101f42"/></linearGradient><linearGradient id="pay" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0070e0"/><stop offset="1" stop-color="#00a8ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#a9bad0}.white{fill:#f4f8ff}.caps{font-size:15px;font-weight:700;letter-spacing:3px}.small{font-size:16px}.label{font-size:18px;font-weight:700}.floor{fill:#112742;stroke:#315170;stroke-width:2}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="390" cy="470" r="300" fill="#2459ff" opacity=".08"/><circle cx="1240" cy="400" r="300" fill="#00c6ff" opacity=".06"/>
<text x="100" y="100" class="caps" fill="#70dcff">OPTIMUM OBJECTIVE OPERATIONAL AI</text><text x="100" y="175" class="white" font-size="54" font-weight="800">O3AI is the engine.</text><text x="100" y="222" class="muted" font-size="25">Evidence-powered AI execution. PayPal is the action it drives.</text>
<rect x="95" y="280" width="930" height="480" rx="34" fill="#0a1a30" stroke="#2e5473" stroke-width="2"/><text x="135" y="330" class="caps" fill="#62dfff">THE O3AI WORKING TOWER · CONTROL PLANE</text>
<rect class="floor" x="140" y="370" width="390" height="78" rx="16"/><circle cx="177" cy="409" r="18" fill="#35d9ff"/><text x="177" y="415" text-anchor="middle" fill="#06182d" font-size="15" font-weight="800">1</text><text x="212" y="405" class="white label">PLANNER</text><text x="212" y="429" class="muted small">Goal → bounded DAG tasks</text>
<rect class="floor" x="560" y="370" width="420" height="78" rx="16"/><circle cx="597" cy="409" r="18" fill="#69a8ff"/><text x="597" y="415" text-anchor="middle" fill="#06182d" font-size="15" font-weight="800">2</text><text x="632" y="405" class="white label">BUILDER</text><text x="632" y="429" class="muted small">Create the requested result</text>
<rect class="floor" x="140" y="470" width="390" height="78" rx="16"/><circle cx="177" cy="509" r="18" fill="#a58bff"/><text x="177" y="515" text-anchor="middle" fill="#06182d" font-size="15" font-weight="800">3</text><text x="212" y="505" class="white label">SECURITY + QA</text><text x="212" y="529" class="muted small">Tests, secrets, deterministic proof</text>
<rect class="floor" x="560" y="470" width="420" height="78" rx="16"/><circle cx="597" cy="509" r="18" fill="#40e0b0"/><text x="597" y="515" text-anchor="middle" fill="#06182d" font-size="15" font-weight="800">4</text><text x="632" y="505" class="white label">RELEASE + MONITOR</text><text x="632" y="529" class="muted small">Evidence report + human gate</text>
<rect x="140" y="585" width="840" height="64" rx="14" fill="#102c3c" stroke="#299777" stroke-width="2"/><path d="M169 617l12 12 23-26" fill="none" stroke="#40e0b0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="612" class="white label">DETERMINISTIC EVIDENCE GATE</text><text x="225" y="635" class="muted small">results/*.json · no AI claim can bypass verification</text>
<rect x="140" y="678" width="840" height="50" rx="14" fill="#292044" stroke="#a58bff" stroke-width="2"/><text x="560" y="710" text-anchor="middle" fill="#d5c9ff" font-size="17" font-weight="700">HUMAN APPROVAL REQUIRED BEFORE ANY PAYMENT</text>
<path d="M1025 510 C1085 510 1085 450 1140 450" fill="none" stroke="#55deff" stroke-width="5" filter="url(#glow)"/><path d="M1125 438l18 12-18 12" fill="none" stroke="#55deff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1150" y="340" width="350" height="230" rx="28" fill="#0c2442" stroke="#2389e7" stroke-width="3"/><text x="1325" y="390" text-anchor="middle" class="caps" fill="#78beff">VERIFIED ACTION</text><rect x="1202" y="416" width="246" height="74" rx="18" fill="url(#pay)"/><text x="1325" y="465" text-anchor="middle" fill="white" font-size="34" font-weight="800">PayPal</text><text x="1325" y="527" text-anchor="middle" class="muted small">Sandbox order · buyer approval · capture</text>
<rect x="1150" y="620" width="350" height="86" rx="20" fill="#102f34" stroke="#299777" stroke-width="2"/><text x="1325" y="656" text-anchor="middle" fill="#58e7bd" font-size="16" font-weight="800" letter-spacing="1">PROOF ATTACHED</text><text x="1325" y="682" text-anchor="middle" class="muted small">Order + capture evidence in O3AI</text><text x="100" y="830" class="white" font-size="23" font-weight="700">O3AI: prove the work before money moves.</text><text x="1500" y="830" text-anchor="end" class="muted small">The engine stays O3AI. The transaction is the output.</text></svg>
